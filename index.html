      // para o botão de instalar abrir diretamente o pedido nativo de "Instalar app".
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();

    <script>
      // Tema guardado neste aparelho (claro é o de todos): aplica já, antes de pintar, para não piscar
      (function () {
        try {
          var t = localStorage.getItem('parou_tema');
          if (t === 'escuro' || t === 'ambar' || t === 'porto') {
            document.documentElement.setAttribute('data-tema', t);
            var cores = { escuro: '#161618', ambar: '#FFE9D2', porto: '#FFFFFF' };
            var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', cores[t]);
            var c = document.querySelector('meta[name="color-scheme"]'); if (c) c.setAttribute('content', t === 'escuro' ? 'dark' : 'light');
          }
        } catch (e) {}
      })();
    </script>
