<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>
  
  <!-- Brand Header -->
  <g transform="translate(100, 140)">
    <!-- Pulse badge -->
    <rect x="0" y="0" width="180" height="38" rx="19" fill="#1e293b" stroke="#334155" />
    <circle cx="24" cy="19" r="6" fill="#ef4444" />
    <text x="42" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f87171">TEMPO REAL 24/7</text>
    
    <!-- Main Logo Title -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-2">
      PAROU<tspan fill="#3b82f6">.</tspan><tspan fill="#ef4444">PT</tspan>
    </text>
    
    <!-- Tagline -->
    <text x="0" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#94a3b8">
      Transportes, Atrasos, Greves e Ocorrências em Portugal
    </text>
  </g>
  
  <!-- Badges Grid -->
  <g transform="translate(100, 380)">
    <!-- Badge 1: Comboios & Metro -->
    <g transform="translate(0, 0)">
      <rect width="230" height="90" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
      <text x="24" y="40" font-family="sans-serif" font-size="22">🚆 🚇</text>
      <text x="24" y="68" font-family="sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">CP &amp; Metro</text>
    </g>
    <!-- Badge 2: Autocarros & Carris -->
    <g transform="translate(250, 0)">
      <rect width="230" height="90" rx="16" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
      <text x="24" y="40" font-family="sans-serif" font-size="22">🚌 🚎</text>
      <text x="24" y="68" font-family="sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Carris &amp; STCP</text>
    </g>
    <!-- Badge 3: Trânsito & Autoestradas -->
    <g transform="translate(500, 0)">
      <rect width="230" height="90" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="24" y="40" font-family="sans-serif" font-size="22">⚠️ 🚗</text>
      <text x="24" y="68" font-family="sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">A1, VCI, 2ª Circular</text>
    </g>
    <!-- Badge 4: Barcos e Travessias -->
    <g transform="translate(750, 0)">
      <rect width="230" height="90" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="24" y="40" font-family="sans-serif" font-size="22">⛴️ ⚓</text>
      <text x="24" y="68" font-family="sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Transtejo Soflusa</text>
    </g>
  </g>
  
  <!-- Footer Canonical URL -->
  <g transform="translate(100, 560)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">
      https://parou.pt
    </text>
    <text x="180" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#64748b">
      • Informação em direto para todo o território nacional
    </text>
  </g>
</svg>